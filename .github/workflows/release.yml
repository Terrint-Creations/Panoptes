name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build source and wheel packages
        run: |
          python -m pip install build
          python -m build
      - name: Build download bundles
        run: |
          ver="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix="Panoptes-$ver/" -o "dist/Panoptes-windows.zip" HEAD
          git archive --format=tar.gz --prefix="panoptes-$ver/" -o "dist/panoptes-linux.tar.gz" HEAD
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Panoptes $GITHUB_REF_NAME" --notes "$notes"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
