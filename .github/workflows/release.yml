name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build tools
        run: python -m pip install pillow
      - name: Build the ready-to-run app
        run: python packaging/build_bundle.py
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive dist/Panoptes-windows-x64.zip -DestinationPath smoke
          ./smoke/Panoptes/panoptes-cli.exe version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:QT_QPA_PLATFORM = "offscreen"
          ./smoke/Panoptes/runtime/python.exe -c "import PySide6.QtWidgets, panoptes.gui.app; print('gui imports ok')"
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          mkdir smoke && tar xzf dist/Panoptes-linux-x64.tar.gz -C smoke
          ./smoke/panoptes/panoptes version
          QT_QPA_PLATFORM=offscreen ./smoke/panoptes/runtime/bin/python3 -c "import PySide6.QtWidgets, panoptes.gui.app; print('gui imports ok')"
      - uses: actions/upload-artifact@v5
        with:
          name: bundle-${{ runner.os }}
          path: dist/Panoptes-*
          compression-level: 0

  publish:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build source and wheel packages
        run: |
          python -m pip install build
          python -m build
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          notes=$(awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Panoptes $GITHUB_REF_NAME" --notes "$notes"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
